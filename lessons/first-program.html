        <h1>Your First Program</h1>
        <p class="lede">Every Node.js file is just a JavaScript file — save it, run it with `node filename.js`, and it executes top to bottom.</p>

        <h2 id="sec-0">Running a file</h2>
<p>Create app.js, write plain JavaScript in it, then run node app.js from the terminal. There's no HTML page, no <script> tag — Node reads the file and executes it directly in the V8 engine.</p>
<ul class="bullets"><li>Top-level code runs immediately, in order</li><li>console.log() prints to your terminal, not a browser devtools panel</li><li>The process exits automatically once there's nothing left to do (no pending timers, servers, etc.)</li></ul>

        <h3>Try it live</h3>

console.<span class="tok-fn">log</span>(<span class="tok-fn">greet</span>(<span class="tok-str">"Developer"</span>));
